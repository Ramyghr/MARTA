assets:
  crypto:
    - symbol: "BTC/USDT"
      exchange: "binance"
      source: "ccxt"
    - symbol: "ETH/USDT"
      exchange: "binance"
      source: "ccxt"
  traditional:
    - symbol: "EURUSD"
      source: "histdata"
      histdata_pair: "eurusd"
    - symbol: "XAUUSD"
      source: "histdata"
      histdata_pair: "xauusd"

date_range:
  start: "2018-01-01"
  # Raw coverage ceiling for fetch_all_assets' cache check. Actual raw parquets go
  # further for crypto (BTC/ETH reach 2026-07-12 via pipeline/fetch_2025.py); forex
  # (EURUSD/XAUUSD) is capped at 2025-12-31 by histdata.com's whole-year-only ZIPs.
  end: "2026-01-01"
  # Train/val/test split boundaries used to be duplicated here (and disagreed, in
  # representation if not in value, with the `model.training` block below and with
  # rl/env.py). They were never actually read from this block by any code — the
  # canonical values now live solely in configs/splits.py.

timeframe:
  candle: "1h"
  window_size: 60
  step: 1

features:
  ohlcv: ["open", "high", "low", "close", "volume"]
  indicators:
    - atr
    - adx
    - rsi
    - bb_width
    - macd_histogram
    - obv_raw
    - vol_zscore
    - realized_vol
    - vol_ratio
    - return_skew
    - return_kurtosis
    - autocorr_lag1
    - realized_vol_raw

normalization:
  window_hours: 720
  min_periods: 168

validation:
  max_gap_hours_crypto: 2
  max_gap_hours_traditional: 72
  # Forex/commodities (EURUSD/XAUUSD) do not trade weekends, so the
  # crypto(24/7) ∩ forex intersection is capped at ~71% (5/7 days) and lands at
  # ~63.6% after holidays — an 80% floor is mathematically unreachable for a
  # crypto-vs-forex dataset. 0.60 is the realistic floor (actual: 63.6%).
  min_timestamp_overlap_pct: 0.60
  zscore_flag_threshold: 5.0

mlflow:
  experiment_name: "marta_data_pipeline"
  run_name: "week1_pipeline"

model:
  input_dim: 14
  hidden_dim: 128
  proj_dim: 64
  n_lstm_layers: 2

training:
  window_size: 60
  step: 1
  batch_size: 512
  lr: 0.001
  weight_decay: 0.0001
  max_epochs: 200
  early_stopping_patience: 20
  warmup_epochs: 10
  gradient_clip_max_norm: 1.0
  # Encoder/HMM split boundary now lives solely in configs/splits.py
  # (TRAIN_END_EXCLUSIVE/VAL_START) — encoder/train.py and regime/hmm.py import it
  # directly and no longer read train_end/val_start from this file.
  # NOTE: 2025 must NOT reach encoder validation — the Kaggle upload is trimmed
  # to <= 2024-12-31 (see kaggle_retrain_instructions.md) so 2025 stays untouched.

data:
  processed_dir: "data/processed"
  assets:
    - BTC_USDT
    - ETH_USDT
    - EURUSD
    - XAUUSD

visualization:
  tsne_n_samples: 3000

convergence:
  max_val_loss: 4.0
  min_top1_acc: 0.20
  min_temperature: 0.03
  max_temperature: 0.30

checkpoints:
  dir: "encoder/checkpoints"
  best: "best_encoder.pt"
  final: "final_encoder.pt"