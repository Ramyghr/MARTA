model:
  input_dim: 14
  hidden_dim: 128
  proj_dim: 64
  n_lstm_layers: 2

training:
  window_size: 60
  step: 1
  batch_size: 512
  lr: 1.0e-3
  weight_decay: 1.0e-4
  max_epochs: 200
  early_stopping_patience: 20
  warmup_epochs: 10
  gradient_clip_max_norm: 1.0
  # 2026-07-13 walk-forward split (matches configs/assets.yaml and rl/env.py):
  # train < 2024-01-01, val = 2024. Test (2025) is SACRED — the Kaggle upload is
  # trimmed to <= 2024-12-31 so 2025 never reaches encoder training or validation.
  # This value was stale at 2020-12-31/2021-01-01 (two split generations behind)
  # until 2026-07-31 — it only worked because the Kaggle notebook %%writefile's its
  # own inline override of this file; a local `python run_encoder.py` run would have
  # silently retrained on the wrong split.
  train_end: "2024-01-01"
  val_start: "2024-01-01"

data:
  assets:
    - BTC_USDT
    - ETH_USDT
    - EURUSD
    - XAUUSD
  processed_dir: "data/processed"

visualization:
  tsne_n_samples: 3000
  tsne_perplexity: 50
  tsne_learning_rate: 200
  tsne_n_iter: 1000

mlflow:
  experiment_name: "marta_encoder_pretraining"
  run_name: "week2_encoder"

convergence:
  max_val_loss: 4.0
  min_top1_acc: 0.20
  min_temperature: 0.03
  max_temperature: 0.30

checkpoints:
  dir: "encoder/checkpoints"
  best: "best_encoder.pt"
  final: "final_encoder.pt"
