services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ../data:/app/data
      - ../encoder:/app/encoder:ro
      - ../agents:/app/agents:ro
      - ../rl:/app/rl:ro
      - ../regime:/app/regime:ro
      # live_feature_bridge.py imports pipeline.features/pipeline.normalize (the same
      # fetch->features->normalize functions training used) — found missing 2026-08-07:
      # without this mount, every live-bridge refresh (BTC/ETH/EURUSD/GOLD) failed inside
      # the actual deployed container with "No module named 'pipeline'", silently
      # swallowed by signal_scheduler's per-asset try/except. The bridge had only ever
      # been verified via direct host-side script runs, never through the running
      # container's own hourly tick.
      - ../pipeline:/app/pipeline:ro
      - ../models:/app/models:ro
      - ../configs:/app/configs:ro
      - ../utils:/app/utils:ro
      - ../mlruns:/app/mlruns
      - ../run_rl.py:/app/run_rl.py:ro
      - ./backend:/dashboard_backend
      - paper_trading_db:/app/paper_trading_db
    # dashboard/backend/.env holds TWELVE_DATA_KEY, ALPACA_API_KEY/SECRET_KEY,
    # TELEGRAM_BOT_TOKEN/CHAT_ID, BINANCE_TESTNET_*, NEWS_API_KEY, etc. — none of these
    # were reaching the container before (confirmed missing 2026-08-01; every live
    # integration gated on one of them, including Alpaca paper trading and the
    # EURUSD/GOLD live-regime bridge, was silently disabled in the dockerized deployment
    # despite the key existing on disk). `environment:` below still overrides any
    # same-named key from this file (e.g. OLLAMA_HOST), per compose's normal precedence.
    env_file:
      - ./backend/.env
    environment:
      - PYTHONPATH=/app
      - MARTA_ROOT=/app
      # Agents call Ollama — Docker can't use localhost, must go via host gateway
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Paper trading DB lives in its own named volume, kept separate from data/
      - PAPER_DB_PATH=/app/paper_trading_db/paper_trading.db
      # mlflow 3.x deprecated the local filesystem tracking store (mlruns/) by default;
      # this dashboard has no tracking server, so opt back in explicitly.
      - MLFLOW_ALLOW_FILE_STORE=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
        NEXT_PUBLIC_WS_URL: ws://localhost:8001
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NEXT_PUBLIC_WS_URL=ws://localhost:8001
    depends_on:
      - backend

volumes:
  paper_trading_db:
