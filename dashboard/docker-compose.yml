services:
  backend:
    build: ./backend
    ports:
      - "8001:8000"
    volumes:
      - ../data:/app/data
      - ../encoder:/app/encoder:ro
      - ../agents:/app/agents:ro
      - ../rl:/app/rl:ro
      - ../regime:/app/regime:ro
      - ../models:/app/models:ro
      - ../configs:/app/configs:ro
      - ../utils:/app/utils:ro
      - ../mlruns:/app/mlruns
      - ../run_rl.py:/app/run_rl.py:ro
      - ./backend:/dashboard_backend
      - paper_trading_db:/app/paper_trading_db
    environment:
      - PYTHONPATH=/app
      - MARTA_ROOT=/app
      # Agents call Ollama — Docker can't use localhost, must go via host gateway
      - OLLAMA_HOST=http://host.docker.internal:11434
      # Paper trading DB lives in its own named volume, kept separate from data/
      - PAPER_DB_PATH=/app/paper_trading_db/paper_trading.db
      # mlflow 3.x deprecated the local filesystem tracking store (mlruns/) by default;
      # this dashboard has no tracking server, so opt back in explicitly.
      - MLFLOW_ALLOW_FILE_STORE=true
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8001
        NEXT_PUBLIC_WS_URL: ws://localhost:8001
    ports:
      - "3001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
      - NEXT_PUBLIC_WS_URL=ws://localhost:8001
    depends_on:
      - backend

volumes:
  paper_trading_db:
